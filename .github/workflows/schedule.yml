name: NEPSE News Bot

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes (GitHub may delay up to ~1hr)
  workflow_dispatch:        # Manual trigger from GitHub UI
  repository_dispatch:      # External cron trigger (cron-job.org → GitHub API)
    types: [run-bot]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Cache pip dependencies for faster runs
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Fonts
        run: |
          # Install Noto fonts via apt (most reliable — covers Devanagari)
          sudo apt-get install -y fonts-noto fonts-noto-core
          # Download Poppins (not in apt)
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf" \
            -o Poppins-Bold.ttf
          # Download Devanagari to working dir as extra fallback
          curl -fL "https://raw.githubusercontent.com/googlefonts/noto-fonts/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf" \
            -o NotoSansDevanagari-Bold.ttf || true
          echo "=== TTF in working dir ==="
          ls -lh *.ttf 2>/dev/null || echo "none"
          echo "=== Noto Devanagari on system ==="
          find /usr/share/fonts -iname "*Devanagari*Bold*" 2>/dev/null | head -5

      # Since we rely on sent_news.json to remember what we sent, we need to load it.
      # Usually, GitHub Actions instances are ephemeral (they start fresh each time).
      # To keep state across runs, we can commit the sent_news.json file back to the repository.
      
      - name: Run Bot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python main.py
          
      - name: Commit State File
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Save the freshly-written state file before any git operations
          cp sent_news.json /tmp/sent_news_new.json
          # Sync to latest origin/main (handles concurrent bot commits)
          git fetch origin main
          git reset --hard origin/main
          # Restore the state file we just generated
          cp /tmp/sent_news_new.json sent_news.json
          git add sent_news.json
          # Skip commit if nothing changed
          git diff --cached --quiet && echo "[INFO] Nothing to commit." && exit 0
          git commit -m "chore: update sent news history"
          git push origin HEAD:main
