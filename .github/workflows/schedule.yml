name: NEPSE News Bot

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 min (GitHub's minimum; public repo = free minutes)
  workflow_dispatch:        # Manual trigger from GitHub UI
  repository_dispatch:      # External cron trigger (cron-job.org → GitHub API)
    types: [run-bot]

# One run at a time: overlapping runs would both send the same news
concurrency:
  group: nepse-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Cache pip dependencies for faster runs
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Since we rely on sent_news.json to remember what we sent, we need to load it.
      # Usually, GitHub Actions instances are ephemeral (they start fresh each time).
      # To keep state across runs, we can commit the sent_news.json file back to the repository.
      
      - name: Run Bot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # AI relevance gate (ai_filter.py); without it, keyword rules
        run: |
          python main.py
          
      - name: Commit State File
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Save the freshly-written state file before any git operations
          cp sent_news.json /tmp/sent_news_new.json
          [ -f ai_decisions.json ] && cp ai_decisions.json /tmp/ai_decisions_new.json || true
          # Sync to latest origin/main (handles concurrent bot commits)
          git fetch origin main
          git reset --hard origin/main
          # Restore the state file we just generated
          cp /tmp/sent_news_new.json sent_news.json
          [ -f /tmp/ai_decisions_new.json ] && cp /tmp/ai_decisions_new.json ai_decisions.json || true
          git add sent_news.json
          [ -f ai_decisions.json ] && git add ai_decisions.json || true
          [ -f emb_cache.json ] && git add emb_cache.json || true
          # Skip commit if nothing changed
          git diff --cached --quiet && echo "[INFO] Nothing to commit." && exit 0
          git commit -m "chore: update sent news history"
          git push origin HEAD:main
