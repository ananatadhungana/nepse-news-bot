name: dup-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests && python dup_test.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
